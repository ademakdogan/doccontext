syntax = "proto3";

package doccontext.v1;

option go_package = "github.com/doccontext/proto/v1;doccontextv1";

// ---------------------------------------------------------------------------
// Common enums & messages
// ---------------------------------------------------------------------------

enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  PDF = 1;
  TXT = 2;
  MD = 3;
}

enum JobType {
  JOB_TYPE_UNSPECIFIED = 0;
  INDEX_DOCUMENT = 1;
  DELETE_DOCUMENT = 2;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  QUEUED = 1;
  RUNNING = 2;
  SUCCEEDED = 3;
  FAILED = 4;
}

enum QueryRoute {
  QUERY_ROUTE_UNSPECIFIED = 0;
  SECTION = 1;
  FULL_DOC = 2;
}

message Citation {
  string document_id = 1;
  string corpus_id = 2;
  int32 chunk_index = 3;
  int32 char_start = 4;
  int32 char_end = 5;
  double score = 6;
}

message HistoryMessage {
  string role = 1;   // "user" or "assistant"
  string content = 2;
}

// ---------------------------------------------------------------------------
// IndexDocument
// ---------------------------------------------------------------------------

message IndexDocumentRequest {
  string document_id = 1;
  string client_id = 2;
  string user_id = 3;
  string corpus_id = 4;
  FileType file_type = 5;
  string storage_path = 6;
  map<string, string> metadata = 7;
}

message IndexDocumentResponse {
  string job_id = 1;
  JobStatus status = 2;
}

// ---------------------------------------------------------------------------
// GetIndexingJobStatus
// ---------------------------------------------------------------------------

message GetIndexingJobStatusRequest {
  string job_id = 1;
}

message GetIndexingJobStatusResponse {
  string job_id = 1;
  string document_id = 2;
  JobStatus status = 3;
  string error_message = 4;
}

// ---------------------------------------------------------------------------
// QueryDocuments
// ---------------------------------------------------------------------------

message QueryDocumentsRequest {
  string client_id = 1;
  string user_id = 2;
  string chat_session_id = 3;
  repeated string corpus_ids = 4;
  string prompt = 5;
  int32 history_window = 6;
  int32 top_k = 7;
  repeated HistoryMessage history = 8;  // caller-supplied; only last history_window pairs used
}

message QueryDocumentsResponse {
  string answer = 1;
  QueryRoute used_route = 2;
  repeated Citation citations = 3;
  double confidence = 4;
}

// ---------------------------------------------------------------------------
// DeleteDocument
// ---------------------------------------------------------------------------

message DeleteDocumentRequest {
  string document_id = 1;
  string client_id = 2;
  string user_id = 3;
}

message DeleteDocumentResponse {
  string job_id = 1;
  JobStatus status = 2;
}

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service DocContext {
  rpc IndexDocument(IndexDocumentRequest) returns (IndexDocumentResponse);
  rpc GetIndexingJobStatus(GetIndexingJobStatusRequest) returns (GetIndexingJobStatusResponse);
  rpc QueryDocuments(QueryDocumentsRequest) returns (QueryDocumentsResponse);
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
}
