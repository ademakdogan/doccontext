[project]
name = "doccontext"
version = "0.1.0"
description = "A multi-tenant RAG service that indexes PDF/TXT/MD documents and answers prompts via a two-stage LLM flow."
readme = "README.md"
authors = [
    { name = "Adem", email = "adem.akdogan03@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.6.2",
    "asyncpg>=0.31.0",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "httpx>=0.28.1",
    "protobuf>=6.33.6",
    "pydantic-settings>=2.5",
    "pypdf>=4.0",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.0",
    "sqlalchemy>=2.0.49",
    "structlog>=24.1",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.12",
    "reportlab>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests that require Docker services or network access",
]
